name: Update Keda Dashboard Data
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_keda_data.py
      - run: |
          git config user.name "keda-regime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh market datasets"
          git push
