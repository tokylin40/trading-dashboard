name: Build Signal Backtest

on:
  schedule:
    # 02:35 UTC = 10:35 Asia/Taipei
    - cron: "35 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build historical technical backtest
        run: python scripts/build_backtest.py

      - name: Commit backtest JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet || git commit -m "chore: rebuild signal backtest"
          git push
